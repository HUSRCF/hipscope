# hw-gate — the last rung of CI.
#
# Every PR gets one required check, `hw-gate`. It passes immediately when the
# diff touches no hardware-relevant surface. Otherwise the PR's code is built
# and exercised against pinned registry fixtures on a self-hosted gfx1201
# runner, and an independent reviewer model reads the diff plus the evidence
# and returns greenlight / needs-human / block.
#
# Trust boundary. Fork PRs execute on a maintainer's machine, so nothing runs
# on the runner until a maintainer applies the `hw-run` label — that label is
# the human "I read this diff". `pull_request_target` means this workflow and
# every script under scripts/hw-gate come from the BASE branch; the PR cannot
# edit its own gate. The PR head is checked out by explicit SHA into a
# separate directory, never onto the base checkout.
#
# Greenlight authority is bounded by scripts/hw-gate/review.py, not by the
# model: fixture failures, policy-file changes, RATCHET-RAISE, and coverage
# gaps can never be approved by the bot. The required `hw-gate` status is the
# merge authority: green on greenlight, green on needs-human only once a
# maintainer applies `human-reviewed`, never green on block.

name: hw-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  statuses: write
  actions: read

concurrency:
  # Code events and the `hw-run` label share one group so a new push cancels a
  # stale hardware run. Every other label event (including the labels
  # review.py itself applies mid-run) lives in a separate group so it can never
  # cancel the run that is producing the verdict.
  group: hw-gate-${{ github.event.pull_request.number || inputs.pr }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'hw-run') && 'label' || 'run' }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}

jobs:
  select:
    name: select buckets
    runs-on: ubuntu-latest
    outputs:
      needs_hw: ${{ steps.sel.outputs.needs_hw }}
      buckets: ${{ steps.sel.outputs.buckets }}
      policy: ${{ steps.sel.outputs.policy }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      authorized: ${{ steps.pr.outputs.authorized }}
      human_reviewed: ${{ steps.pr.outputs.human_reviewed }}
      # true when this event should (re)run the hardware + reviewer jobs:
      # every code event, plus the `hw-run` label itself. Other label events
      # (e.g. `human-reviewed`) only re-evaluate the recorded verdict.
      run_hw: ${{ steps.pr.outputs.run_hw }}
    steps:
      - name: Base checkout (gate scripts come from the base branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clear per-commit labels on new commits
        # A push invalidates every human and bot signature on the previous commit.
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for l in hw-run human-reviewed agent-approved needs-human hw-gate-blocked; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$l" >/dev/null 2>&1 || true
          done
      - name: Resolve PR head and labels
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefOid,headRefOid,labels,isDraft)
          echo "base_sha=$(jq -r .baseRefOid <<<"$json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r .headRefOid <<<"$json")" >> "$GITHUB_OUTPUT"
          has() { jq -e --arg n "$1" '.labels[] | select(.name==$n)' <<<"$json" >/dev/null; }
          echo "authorized=$(has hw-run && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "human_reviewed=$(has human-reviewed && echo true || echo false)" >> "$GITHUB_OUTPUT"
          action='${{ github.event.action }}'
          label='${{ github.event.label.name }}'
          if [ "$action" = "labeled" ] && [ "$label" != "hw-run" ]; then
            echo "run_hw=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_hw=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch PR head
        run: git fetch --no-tags origin "${{ steps.pr.outputs.head_sha }}"
      - name: Select buckets from the diff
        id: sel
        run: |
          set -euo pipefail
          git diff --name-only "${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }}" \
            | python3 scripts/hw-gate/select.py --github-output "$GITHUB_OUTPUT" --json select.json
          cat select.json
      - uses: actions/upload-artifact@v4
        with:
          name: hw-gate-select
          path: select.json

  hw-run:
    name: hardware run (gfx1201)
    needs: select
    if: needs.select.outputs.needs_hw == 'true' && needs.select.outputs.authorized == 'true' && needs.select.outputs.run_hw == 'true'
    runs-on: [self-hosted, hiptrx, gfx1201]
    timeout-minutes: 45
    env:
      # One GPU for the gate; the other four stay interactive.
      HIPFIRE_HOME: ${{ github.workspace }}/.hw-gate-home
      HIPFIRE_MODELS_DIR: /home/kaden/.hipfire/models
      HW_GATE_DEVICE: "3"
      CARGO_TARGET_DIR: /home/kaden/actions-runner/_cache/hw-gate-target
    steps:
      - name: Base checkout (gate scripts)
        uses: actions/checkout@v4
        with:
          path: base
      - name: PR head checkout (code under test, by SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.head_sha }}
          path: pr
          fetch-depth: 0
      - name: Run buckets
        run: |
          set -euo pipefail
          python3 base/scripts/hw-gate/run.py \
            --repo pr \
            --fixtures base/scripts/hw-gate/fixtures.json \
            --base "${{ needs.select.outputs.base_sha }}" \
            --head "${{ needs.select.outputs.head_sha }}" \
            --buckets "${{ needs.select.outputs.buckets }}" \
            --device "$HW_GATE_DEVICE" \
            --out hw-gate.json --md hw-gate.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw-gate-evidence
          path: |
            hw-gate.json
            hw-gate.md
            hw-gate-logs/

  hw-review:
    name: reviewer (omp / reviewer role)
    needs: [select, hw-run]
    if: always() && needs.select.outputs.needs_hw == 'true' && needs.select.outputs.authorized == 'true' && needs.select.outputs.run_hw == 'true'
    runs-on: [self-hosted, hiptrx, gfx1201]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.HW_GATE_TOKEN || github.token }}
    steps:
      - name: Base checkout (gate scripts)
        uses: actions/checkout@v4
        with:
          path: base
          fetch-depth: 0
      - name: PR head checkout (read-only for the reviewer)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.head_sha }}
          path: pr
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: hw-gate-evidence
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: hw-gate-select
          path: evidence
      - name: Review and decide
        run: |
          set -euo pipefail
          python3 base/scripts/hw-gate/review.py \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --base "${{ needs.select.outputs.base_sha }}" \
            --head "${{ needs.select.outputs.head_sha }}" \
            --checkout pr \
            --evidence evidence/hw-gate.json \
            --select evidence/select.json \
            --hw-run-result "${{ needs.hw-run.result }}" \
            --system-prompt base/scripts/hw-gate/review.md \
            --out verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw-gate-verdict
          path: verdict.json

  hw-gate:
    # The one required status check, and the merge authority. Deterministic:
    # it reads the recorded verdict for this head SHA, never the model.
    #   greenlight  -> green
    #   needs-human -> red until a maintainer who has read the evidence applies
    #                  `human-reviewed` (a logged signature; cleared on every push)
    #   block       -> red; no label clears it, only a new commit
    # With enforce_admins on this binds every merger. The emergency path is
    # explicit and audited: DELETE /branches/master/protection/enforce_admins,
    # push, POST it back.
    name: hw-gate
    needs: [select, hw-run, hw-review]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Preconditions
        run: |
          set -euo pipefail
          echo "needs_hw=${{ needs.select.outputs.needs_hw }} authorized=${{ needs.select.outputs.authorized }} run_hw=${{ needs.select.outputs.run_hw }} human_reviewed=${{ needs.select.outputs.human_reviewed }}"
          echo "hw-run=${{ needs.hw-run.result }} hw-review=${{ needs.hw-review.result }}"
          if [ "${{ needs.select.result }}" != "success" ]; then
            echo "::error::bucket selection failed"; exit 1
          fi
          if [ "${{ needs.select.outputs.needs_hw }}" != "true" ]; then
            echo "no hardware-relevant surface touched"; echo "skip=true" >> "$GITHUB_ENV"; exit 0
          fi
          if [ "${{ needs.select.outputs.run_hw }}" = "true" ]; then
            # This event ran the hardware + reviewer jobs: their results are authoritative.
            if [ "${{ needs.select.outputs.authorized }}" != "true" ]; then
              echo "::error::hardware-relevant diff; a maintainer must apply the 'hw-run' label"; exit 1
            fi
            if [ "${{ needs.hw-run.result }}" != "success" ]; then
              echo "::error::hardware run did not pass"; exit 1
            fi
            if [ "${{ needs.hw-review.result }}" != "success" ]; then
              echo "::error::reviewer did not complete"; exit 1
            fi
            echo "verdict_source=this-run" >> "$GITHUB_ENV"
          else
            echo "verdict_source=recorded" >> "$GITHUB_ENV"
          fi
      - name: Verdict from this run
        if: env.skip != 'true' && env.verdict_source == 'this-run'
        uses: actions/download-artifact@v4
        with:
          name: hw-gate-verdict
          path: verdict
      - name: Verdict recorded for this commit
        if: env.skip != 'true' && env.verdict_source == 'recorded'
        run: |
          set -euo pipefail
          # Label-only event: reuse the newest verdict recorded for exactly this
          # head SHA. The run that produces it may still be uploading (review.py
          # applies labels before its job ends), so poll for up to 5 minutes.
          head='${{ needs.select.outputs.head_sha }}'
          mkdir -p verdict
          for attempt in $(seq 1 15); do
            ids=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow hw-gate.yml --commit "$head" --limit 20 --json databaseId -q '.[].databaseId')
            for id in $ids; do
              [ "$id" = "$GITHUB_RUN_ID" ] && continue
              if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n hw-gate-verdict -D verdict >/dev/null 2>&1 && [ -f verdict/verdict.json ]; then
                echo "reusing verdict from run $id"; exit 0
              fi
            done
            sleep 20
          done
          echo "::error::no hardware run recorded for $head; apply the 'hw-run' label"; exit 1
      - name: Decide
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          decision=$(jq -r '.floor.final_decision // "needs-human"' verdict/verdict.json)
          reasons=$(jq -r '.floor.applied | join(", ")' verdict/verdict.json)
          echo "final_decision=$decision floor=[$reasons] human_reviewed=${{ needs.select.outputs.human_reviewed }}"
          case "$decision" in
            greenlight)
              echo "floor-approved greenlight; hardware evidence and review recorded"; exit 0 ;;
            needs-human)
              if [ "${{ needs.select.outputs.human_reviewed }}" = "true" ]; then
                echo "needs-human cleared by a maintainer's 'human-reviewed' label ($reasons)"; exit 0
              fi
              echo "::error::hw-gate needs a human: read the evidence and verdict comments, then apply 'human-reviewed' ($reasons)"; exit 1 ;;
            *)
              echo "::error::hw-gate blocked ($reasons); only a new commit clears a block"; exit 1 ;;
          esac
