[package]
name = "hipfire-isa"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "peacemaker"
path = "src/bin/peacemaker.rs"
required-features = ["toolchain"]

[features]
toolchain = ["dep:radiowave"]
# `region-import --gdn-object`: lift the hipcc code object with peacemaker.
lift = ["dep:peacemaker-lift", "dep:peacemaker-ir"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
radiowave = { path = "../radiowave", optional = true }
peacemaker-lift = { path = "../peacemaker-lift", optional = true }
peacemaker-ir = { path = "../peacemaker-ir", optional = true }
