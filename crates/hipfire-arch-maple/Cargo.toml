[package]
name = "hipfire-arch-maple"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Maple-Preview 20B-A1B architecture (natively-ternary 256-expert MoE on every layer, 3:1 sliding/NoPE-full attention, QK-norm before partial RoPE, clamped SwiGLU, untied lm_head) for hipfire"

[features]
default = ["deltanet"]
# Mirrors hipfire-arch-cohere2moe: the shared MoE rotate/silu helpers in
# hipfire-runtime::llama are deltanet-gated.
deltanet = ["hipfire-runtime/deltanet", "rdna-compute/deltanet"]

[dependencies]
hipfire-config = { path = "../hipfire-config" }
hipfire-runtime = { path = "../hipfire-runtime" }
hipfire-dispatch = { path = "../hipfire-dispatch", features = ["from-hip-error"] }
hip-bridge = { path = "../hip-bridge" }
rdna-compute = { path = "../rdna-compute" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
